version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - misspell
  exclusions:
    rules:
      # Tests read fixtures and docs by computed path.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
